name: taafi
description: "Taafi — home healthcare at your doorstep."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  # NOTE: google_maps_flutter was removed with the patient map view — no Dart
  # code imported it, and the Android manifest only ever carried a placeholder
  # API key. The two surfaces that DO show a map (admin live monitor, chat
  # location messages) use flutter_map + OpenStreetMap, which needs no key.
  geolocator: ^13.0.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.0.5
  url_launcher: ^6.3.1
  fl_chart: ^0.69.0
  google_sign_in: ^6.2.2
  socket_io_client: ^3.1.4
  audioplayers: ^6.1.0
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  # In-app PDF rendering for patient-attached medical records. `pdf` above
  # only WRITES documents (prescription pads) and `printing` lays those out —
  # neither displays an arbitrary PDF we fetched. A clinician standing at a
  # patient's door reading a discharge summary must not get bounced into
  # another app mid-visit, so the viewer is embedded. Backed by native
  # AndroidPdfViewer / PDFKit, and it renders from a local file path, which is
  # why the viewer downloads the grant's bytes to a temp file first.
  flutter_pdfview: ^1.4.1
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  image: ^4.8.0
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1

# Native launcher icon generation (run: dart run flutter_launcher_icons)
# Source art is cropped from assets/logo/taafi-logo.png:
#   - app_icon.png            -> full square tile (iOS + legacy Android)
#   - app_icon_foreground.png -> glyph inset into the adaptive safe zone
flutter_launcher_icons:
  android: true          # keeps default @mipmap/ic_launcher (matches AndroidManifest)
  ios: false             # no iOS project in this repo (Android/web/linux only)
  image_path: "assets/logo/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B1420"
  adaptive_icon_foreground: "assets/logo/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/logo/app_icon.png"
    background_color: "#0B1420"
    theme_color: "#0B1420"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/data/
    - assets/sounds/
    - assets/logo/
    - assets/audio/

  # Fonts commented out - using system fonts as fallback
  # To enable custom fonts:
  # 1. Add font files to assets/fonts/
  # 2. Uncomment the fonts section below
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Inter-ExtraBold.ttf
  #         weight: 800
  #   - family: Kalpurush
  #     fonts:
  #       - asset: assets/fonts/kalpurush.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
